<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أداة الترخيص</title>
<style>body{font-family:system-ui,Tahoma,sans-serif;max-width:520px;margin:auto;padding:16px;background:#f6f5f1;color:#1d1d1b}.c{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}textarea,input{width:100%;font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;direction:ltr;margin:6px 0;box-sizing:border-box}button{width:100%;font:inherit;padding:10px;border:0;border-radius:8px;background:#be185d;color:#fff;font-weight:600;margin-top:4px}.w{color:#b42318;font-size:13px}</style></head><body>
<div class="c"><h3>1) مفاتيح الترخيص (مرة واحدة)</h3><div class="w">المفتاح الخاص سرّي: لا يوضع في التطبيق ولا يُشارك. خذ منه نسخة احتياطية، فإن ضاع لن تستطيع تفعيل أجهزة جديدة.</div>
<button id="k">إنشاء مفاتيح جديدة</button><b>المفتاح العام (الصقه في www/index.html مكان null بعد PUB=):</b><textarea id="pub" rows="4" readonly></textarea>
<button id="pv">عرض المفتاح الخاص (للنسخ الاحتياطي)</button><textarea id="prv" rows="4" style="display:none"></textarea><button id="pi">استيراد مفتاح خاص (الصقه في الخانة أعلاه)</button></div>
<div class="c"><h3>2) توقيع رمز جهاز</h3><input id="dc" placeholder="رمز الجهاز (16 خانة)"><button id="sg">توليد الرقم التسلسلي</button><textarea id="out" rows="3" readonly></textarea><button id="cp">نسخ</button></div>
<script>
const $=i=>document.getElementById(i),te=new TextEncoder(),A={name:"ECDSA",namedCurve:"P-256"};
const b64=u=>{let s="";for(const x of new Uint8Array(u))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const show=()=>{$("pub").value=localStorage.getItem("pub")||"لا يوجد مفتاح بعد"};
$("k").onclick=async()=>{if(localStorage.getItem("prv")&&!confirm("يوجد مفتاح سابق! الجديد يُبطل كل التراخيص السابقة. متابعة؟"))return;
const k=await crypto.subtle.generateKey(A,true,["sign","verify"]);
localStorage.setItem("pub",JSON.stringify(await crypto.subtle.exportKey("jwk",k.publicKey)));
localStorage.setItem("prv",JSON.stringify(await crypto.subtle.exportKey("jwk",k.privateKey)));show()};
$("pv").onclick=()=>{$("prv").style.display="block";$("prv").value=localStorage.getItem("prv")||""};
$("pi").onclick=()=>{try{const j=JSON.parse($("prv").value);localStorage.setItem("prv",JSON.stringify(j));localStorage.setItem("pub",JSON.stringify({kty:j.kty,crv:j.crv,x:j.x,y:j.y,ext:true,key_ops:["verify"]}));show();alert("تم")}catch(e){alert("مفتاح غير صالح")}};
$("sg").onclick=async()=>{try{const c=$("dc").value.replace(/[^0-9a-f]/gi,"").toUpperCase();if(c.length!==16)throw 0;
const k=await crypto.subtle.importKey("jwk",JSON.parse(localStorage.getItem("prv")),A,false,["sign"]);
$("out").value=b64(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},k,te.encode(c)))}catch(e){$("out").value="رمز غير صحيح أو لا يوجد مفتاح"}};
$("cp").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($("out").value);
show();
</script></body></html>
