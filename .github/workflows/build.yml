name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Harden (no backup, no screenshots)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/nursing/schedule/MainActivity.java <<'J'
          package com.nursing.schedule;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,WindowManager.LayoutParams.FLAG_SECURE);
              super.onCreate(b);
            }
          }
          J
      - name: Icon
        run: if [ -f resources/icon.png ]; then npx capacitor-assets generate --android; fi
      - run: npx cap sync android
      - name: Build
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd android
          if [ -z "$KS_B64" ]; then
            ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
          else
            ./gradlew assembleRelease
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > ../ks.jks
            $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../al.apk
            $BT/apksigner sign --ks ../ks.jks --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KS_ALIAS" --out ../app.apk ../al.apk
          fi
      - uses: actions/upload-artifact@v4
        with: {name: nursing-apk, path: app.apk}
